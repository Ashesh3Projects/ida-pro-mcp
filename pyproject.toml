[project]
name = "ida-pro-mcp"
version = "4.0.1"
description = "Typed IDA analysis with shared database sessions and official MCP integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "mrexodia" },
    { name = "can1357" },
    { name = "IDA Pro MCP Contributors" },
]
keywords = ["ida", "mcp", "llm", "plugin"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "anyio>=4.9",
    "fastmcp==4.1.0",
    "mcp==2.3.0",
    "jsonschema>=4.20.0",
    "idapro>=0.0.10",
    "tomli-w>=1.0.0",
    "ida-mcp==20260929.0.1",
    "ida-nexus==0.13.0",
    "ida-domain==0.5.1",
    "zeromcp==1.10.3",
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "jsonschema>=4.0",
    "pytest>=9.0.3",
]

[project.urls]
Repository = "https://github.com/ashesh3projects/ida-pro-mcp"
Issues = "https://github.com/ashesh3projects/ida-pro-mcp/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
ida-pro-mcp = "ida_pro_mcp.cli:main"
ida-pro-mcp-legacy = "ida_pro_mcp.server:main"
idalib-mcp = "ida_pro_mcp.idalib_supervisor:main"
ida-mcp-test = "ida_pro_mcp.test:main"
ida-mcp-trace-dump = "ida_pro_mcp.trace_dump:main"

[tool.pyright]
include = ["src/ida_pro_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
ida-mcp = { git = "https://github.com/HexRaysSA/ida-mcp", rev = "cb2735f4ef8fbb31c666c411f4c8819ff42e25cb" }

[tool.ruff]
exclude = ["src/ida_pro_mcp/ida_mcp/zeromcp/*.py"]

[tool.coverage.run]
relative_files = true
include = ["src/ida_pro_mcp/*"]
omit = [
    "src/ida_pro_mcp/ida_mcp/tests/*",
    "src/ida_pro_mcp/ida_mcp/zeromcp/*",
]
