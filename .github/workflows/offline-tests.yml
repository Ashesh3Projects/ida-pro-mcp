name: offline-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed dependencies and test tools
        run: |
          python scripts/bootstrap_unified.py --wheel-dir wheels --install
          python -m pip install pytest jsonschema "mcp>=1,<2" build
      - name: Run non-IDA tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
